name: Refactor H3 modules v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-h3-modules-v2.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run corrected consolidation script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/refactor-h3-modules.yml').read_text(encoding='utf-8')
          marker = '      - name: Consolidate H3 frontend modules\n        shell: python\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - name: Validate imports and commit', start)
          block = textwrap.dedent(source[start:end])
          old = '''# No z-prefixed runtime modules should remain after this consolidation.\nleftovers = [p.name for p in web.glob('z*.js')]\nif leftovers:\n    raise RuntimeError(f'Unexpected z-prefixed web modules remain: {leftovers}')\n\nPath('.github/workflows/refactor-h3-modules.yml').unlink(missing_ok=True)'''
          new = '''# Rename the remaining active z-prefixed module to a formal semantic name.\nnative_old = web / 'zzz_h3_native_wire_bus.js'\nnative_new = web / 'h3_native_wire_bus.js'\nif native_old.exists():\n    native_old.replace(native_new)\n\nleftovers = [p.name for p in web.glob('z*.js')]\nif leftovers:\n    raise RuntimeError(f'Unexpected z-prefixed web modules remain: {leftovers}')\n\nPath('.github/workflows/refactor-h3-modules.yml').unlink(missing_ok=True)\nPath('.github/workflows/refactor-h3-modules-v2.yml').unlink(missing_ok=True)'''
          if old not in block:
              raise RuntimeError('Could not locate final z-module guard in source workflow')
          block = block.replace(old, new)
          exec(compile(block, '<h3-refactor>', 'exec'))

      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          web = Path('web')
          for name in ['h3_rich_text.js','h3_prompt_editor.js','h3_shot_timeline.js','h3_prompt_layout.js','h3_prompt_view_toggle.js','h3_native_wire_bus.js']:
              assert (web / name).exists(), name
          assert not list(web.glob('z*.js'))
          assert 'h3_rich_text.js' in (web / 'h3_prompt_editor.js').read_text(encoding='utf-8')
          assert 'h3_rich_text.js' in (web / 'h3_shot_timeline.js').read_text(encoding='utf-8')
          PY
          git config user.name "TerryTools Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate H3 frontend modules"
          git push origin main
