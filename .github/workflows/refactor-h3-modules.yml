name: Refactor H3 modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-h3-modules.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate H3 frontend modules
        shell: python
        run: |
          from pathlib import Path
          import re

          web = Path('web')

          # ---------- shared rich text module fixes ----------
          rich = (web / 'h3_rich_text.js').read_text(encoding='utf-8')
          if not rich.startswith('import { app }'):
              rich = 'import { app } from "../../scripts/app.js";\n\n' + rich
          rich = rich.replace('globalThis.app?.ui?.settings?.getSettingValue?.("Comfy.Locale")', 'app?.ui?.settings?.getSettingValue?.("Comfy.Locale")')
          rich = rich.replace('function baseChip(raw, type) {\n  const chip = document.createElement("span");\n  chip.className = `terry-h3-chip terry-h3-type-${type}`;', 'function baseChip(raw, type, options = {}) {\n  const chip = document.createElement("span");\n  chip.className = `terry-h3-chip terry-h3-type-${type}${options.extraChipClass ? ` ${options.extraChipClass}` : ""}`;')
          rich = rich.replace('function dialogueChip(raw, onChange) {', 'function dialogueChip(raw, onChange, options = {}) {')
          rich = rich.replace('const chip = baseChip(raw, "dialogue");', 'const chip = baseChip(raw, "dialogue", options);')
          rich = rich.replace('function mediaChip(raw, type, resolveMedia) {', 'function mediaChip(raw, type, resolveMedia, options = {}) {')
          rich = rich.replace('const chip = baseChip(raw, type);', 'const chip = baseChip(raw, type, options);')
          rich = rich.replace('if (type === "dialogue") return dialogueChip(raw, options.onChange);', 'if (type === "dialogue") return dialogueChip(raw, options.onChange, options);')
          rich = rich.replace('if (["picture", "video", "audio"].includes(type)) return mediaChip(raw, type, options.resolveMedia);', 'if (["picture", "video", "audio"].includes(type)) return mediaChip(raw, type, options.resolveMedia, options);')
          rich = rich.replace('const chip = baseChip(raw, type);', 'const chip = baseChip(raw, type, options);')
          (web / 'h3_rich_text.js').write_text(rich, encoding='utf-8')

          # ---------- prompt editor uses shared formatter ----------
          p = web / 'h3_prompt_editor.js'
          text = p.read_text(encoding='utf-8')
          anchor = 'import { attachH3Menus } from "./h3_shared_menus.js";\n'
          shared_import = '''import {\n  bindH3TagInteractions,\n  insertH3RichTextAtSelection,\n  installH3RichTextStyles,\n  renderH3RawText,\n  renderH3RichText,\n  serializeH3RichText,\n} from "./h3_rich_text.js";\n'''
          if shared_import not in text:
              text = text.replace(anchor, anchor + shared_import)
          text = re.sub(r'const CARET = .*?;\n\nconst SECTIONS = new Set\(\[.*?\]\);\nconst MARKERS = new Set\(\[.*?\]\);\n\n', '', text, flags=re.S)
          start = text.index('function makeChip(')
          end = text.index('function currentRaw(', start)
          replacement = '''function richOptions(node) {\n  return {\n    resolveMedia(kind, index) {\n      return mediaOptions(node).find((item) => item.kind === kind && item.index === Number(index)) || null;\n    },\n    onChange: () => syncFromEditor(node),\n  };\n}\n\nfunction renderVisual(node, raw) {\n  renderH3RichText(node.__terryH3Editor, raw, richOptions(node));\n}\n\nfunction editorRaw(editor) {\n  return serializeH3RichText(editor);\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          text = re.sub(r'function appendRawEditor\(editor, raw\) \{.*?\n\}', 'function appendRawEditor(editor, raw) {\n  renderH3RawText(editor, raw);\n}', text, flags=re.S)
          parse_start = text.index('function parsePasted(')
          parse_end = text.index('function ensureEditor(', parse_start)
          text = text[:parse_start] + '''function parsePasted(node, editor, text) {\n  return insertH3RichTextAtSelection(editor, text, richOptions(node));\n}\n\n''' + text[parse_end:]
          menu_anchor = '''  node.__terryH3MenuController = attachH3Menus({\n    node,\n    editor,\n    mode: "prompt",\n    onChange: () => syncFromEditor(node),\n  });\n'''
          if 'bindH3TagInteractions(editor' not in text:
              text = text.replace(menu_anchor, menu_anchor + '''  bindH3TagInteractions(editor, {\n    node,\n    getSourceText: () => currentRaw(node),\n    onChange: () => syncFromEditor(node),\n  });\n''')
          text = text.replace('installStyle(); patchCanvas(); patchGraphToPrompt();', 'installStyle(); installH3RichTextStyles(); patchCanvas(); patchGraphToPrompt();')
          p.write_text(text, encoding='utf-8')

          # ---------- timeline uses shared formatter ----------
          p = web / 'h3_shot_timeline.js'
          timeline = p.read_text(encoding='utf-8')
          anchor = 'import { attachH3Menus } from "./h3_shared_menus.js";\n'
          shared_import = '''import {\n  bindH3TagInteractions,\n  installH3RichTextStyles,\n  renderH3RichText,\n  serializeH3RichText,\n} from "./h3_rich_text.js";\n'''
          if shared_import not in timeline:
              timeline = timeline.replace(anchor, anchor + shared_import)
          start = timeline.index('const TOKEN_RE =')
          end = timeline.index('function createEditor(', start)
          replacement = '''function timelineRichOptions(node, onChange) {\n  return {\n    extraChipClass: "terry-tl-chip",\n    resolveMedia(kind, index) {\n      return mediaOptions(node).find((item) => item.kind === kind && item.index === Number(index)) || null;\n    },\n    onChange,\n  };\n}\n\nfunction createRichEditor(node, value, placeholder, onChange) {\n  const editor = document.createElement("div");\n  editor.className = "terry-tl-rich";\n  editor.contentEditable = "true";\n  editor.dataset.placeholder = placeholder;\n  let lastValue = String(value || "");\n  const commit = () => { lastValue = serializeH3RichText(editor); onChange(lastValue); };\n  const options = timelineRichOptions(node, commit);\n  renderH3RichText(editor, lastValue, options);\n  bindH3TagInteractions(editor, {\n    node,\n    getSourceText: () => serializeH3RichText(editor),\n    onChange: commit,\n  });\n  editor.addEventListener("input", commit);\n  editor.addEventListener("terrychange", commit);\n  editor.addEventListener("keydown", (event) => { if (event.key === "Enter") event.stopPropagation(); });\n  editor.addEventListener("blur", () => setTimeout(() => {\n    const valueNow = serializeH3RichText(editor);\n    renderH3RichText(editor, valueNow, timelineRichOptions(node, commit));\n  }, 100));\n  const menuController = attachH3Menus({ node, editor, mode: "timeline", onChange: commit });\n  return {\n    editor, menuController,\n    setValue(next) {\n      next = String(next || "");\n      if (next === lastValue) return;\n      lastValue = next;\n      renderH3RichText(editor, next, timelineRichOptions(node, commit));\n    },\n    refreshAssets() {\n      const current = serializeH3RichText(editor);\n      renderH3RichText(editor, current, timelineRichOptions(node, commit));\n    },\n  };\n}\n\n'''
          timeline = timeline[:start] + replacement + timeline[end:]
          timeline = timeline.replace('installStyle(); patchCanvas(); patchGraphToPrompt();', 'installStyle(); installH3RichTextStyles(); patchCanvas(); patchGraphToPrompt();')

          # Merge active timeline patch modules into the official timeline module.
          merge_files = [
              'h3_timeline_chip_rebind_and_scroll.js',
              'h3_timeline_color_theme.js',
              'h3_timeline_editor_integrity.js',
              'h3_timeline_lane_polish.js',
              'h3_timeline_transport_prune.js',
              'zz_h3_timeline_ux_v2.js',
          ]
          merged = []
          for filename in merge_files:
              path = web / filename
              if not path.exists():
                  continue
              body = path.read_text(encoding='utf-8')
              body = re.sub(r'^import \{ app \} from "\.\./\.\./scripts/app\.js";\n', '', body)
              body = re.sub(r'^import \{ api \} from "\.\./\.\./scripts/api\.js";\n', '', body)
              body = body.lstrip()
              merged.append(f'\n\n/* Consolidated from {filename}. */\n{{\n{body}\n}}\n')
              path.unlink()
          if merged:
              timeline += ''.join(merged)
          p.write_text(timeline, encoding='utf-8')

          # ---------- Prompt view toggle: keep only the real toggle responsibility ----------
          (web / 'h3_prompt_view_toggle.js').write_text('''import { app } from "../../scripts/app.js";\n\nconst NODE_ID = "TerryH3PromptEditor";\nconst VIEW_PROP = "terry_h3_view_mode";\n\nfunction isTarget(node) {\n  return [node?.comfyClass, node?.type, node?.constructor?.type, node?.constructor?.comfyClass, node?.constructor?.nodeData?.name]\n    .some((value) => String(value || "") === NODE_ID);\n}\n\nfunction widget(node, name) { return node?.widgets?.find((item) => item?.name === name) || null; }\n\nfunction syncView(node) {\n  const toggle = widget(node, "visual_preview");\n  const button = node.__terryH3ViewButton;\n  if (!toggle || !button) return false;\n  const wantsVisual = Boolean(toggle.value);\n  const isVisual = node?.properties?.[VIEW_PROP] !== "raw";\n  if (wantsVisual !== isVisual) button.click();\n  button.style.display = "none";\n  return true;\n}\n\nfunction bind(node) {\n  if (!isTarget(node)) return false;\n  const toggle = widget(node, "visual_preview");\n  if (!toggle) return false;\n  if (!toggle.__terryH3ViewToggleBound) {\n    toggle.__terryH3ViewToggleBound = true;\n    const original = toggle.callback;\n    toggle.callback = function(value) {\n      const result = original?.apply(this, arguments);\n      toggle.value = Boolean(value);\n      queueMicrotask(() => syncView(node));\n      return result;\n    };\n  }\n  return syncView(node);\n}\n\nfunction installSoon(node) {\n  let attempts = 0;\n  const run = () => { attempts += 1; if (bind(node) || attempts >= 12) return; setTimeout(run, Math.min(800, attempts * 60)); };\n  setTimeout(run, 0);\n}\n\napp.registerExtension({\n  name: "TerryTools.H3PromptViewToggle",\n  setup() {\n    const style = document.createElement("style");\n    style.textContent = ".terry-h3-view{display:none!important}";\n    document.head.append(style);\n  },\n  nodeCreated(node) { if (isTarget(node)) installSoon(node); },\n  loadedGraphNode(node) { if (isTarget(node)) installSoon(node); },\n});\n''', encoding='utf-8')
          (web / 'h3_prompt_commands.js').unlink(missing_ok=True)

          # ---------- Prompt layout: Nodes 2.0 sizing only, no token localization ----------
          (web / 'h3_prompt_layout.js').write_text('''import { app } from "../../scripts/app.js";\n\nconst NODE_ID = "TerryH3PromptEditor";\nfunction isTarget(node) {\n  return [node?.comfyClass, node?.type, node?.constructor?.type, node?.constructor?.comfyClass, node?.constructor?.nodeData?.name]\n    .some((value) => String(value || "") === NODE_ID);\n}\nfunction applyLayout(node) {\n  const wrap = node?.__terryH3Wrap;\n  const editor = node?.__terryH3Editor;\n  const dom = node?.__terryH3DomWidget;\n  if (!wrap || !editor) return false;\n  wrap.style.setProperty("height", "504px", "important");\n  wrap.style.setProperty("min-height", "0px", "important");\n  wrap.style.setProperty("max-height", "728px", "important");\n  wrap.style.setProperty("overflow", "hidden", "important");\n  wrap.style.setProperty("contain", "size layout paint", "important");\n  editor.style.setProperty("height", "100%", "important");\n  editor.style.setProperty("min-height", "0px", "important");\n  editor.style.setProperty("max-height", "100%", "important");\n  editor.style.setProperty("overflow-y", "auto", "important");\n  editor.style.setProperty("overflow-x", "hidden", "important");\n  if (dom && !dom.__terryPromptLayoutBound) {\n    dom.__terryPromptLayoutBound = true;\n    dom.computeSize = (width) => [Math.max(300, Number(width) || Number(node.size?.[0]) || 520), 518];\n    dom.getMinHeight = () => 420;\n    dom.getMaxHeight = () => 728;\n  }\n  return true;\n}\nfunction installSoon(node) {\n  let attempts = 0;\n  const run = () => { attempts += 1; if (applyLayout(node) || attempts >= 12) return; setTimeout(run, Math.min(800, attempts * 60)); };\n  setTimeout(run, 0);\n}\napp.registerExtension({\n  name: "TerryTools.H3PromptLayout",\n  setup() {\n    const style = document.createElement("style");\n    style.id = "terry-h3-prompt-layout-style";\n    style.textContent = ".terry-h3-wrap{height:504px!important;min-height:0!important;max-height:728px!important;overflow:hidden!important;contain:size layout paint!important}.terry-h3-editor{height:100%!important;min-height:0!important;max-height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;scrollbar-gutter:stable;overscroll-behavior:contain}";\n    document.head.append(style);\n  },\n  nodeCreated(node) { if (isTarget(node)) installSoon(node); },\n  loadedGraphNode(node) { if (isTarget(node)) installSoon(node); },\n});\n''', encoding='utf-8')
          (web / 'h3_preview_zh_and_nodes2_fix.js').unlink(missing_ok=True)
          (web / 'h3_visual_types_and_shot_picker.js').unlink(missing_ok=True)

          # No z-prefixed runtime modules should remain after this consolidation.
          leftovers = [p.name for p in web.glob('z*.js')]
          if leftovers:
              raise RuntimeError(f'Unexpected z-prefixed web modules remain: {leftovers}')

          Path('.github/workflows/refactor-h3-modules.yml').unlink(missing_ok=True)

      - name: Validate imports and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ['web/h3_rich_text.js', 'web/h3_prompt_editor.js', 'web/h3_shot_timeline.js', 'web/h3_prompt_layout.js', 'web/h3_prompt_view_toggle.js']
          for f in required:
              assert Path(f).exists(), f
          assert 'h3_rich_text.js' in Path('web/h3_prompt_editor.js').read_text(encoding='utf-8')
          assert 'h3_rich_text.js' in Path('web/h3_shot_timeline.js').read_text(encoding='utf-8')
          PY
          git config user.name "TerryTools Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate H3 frontend modules"
          git push origin main
