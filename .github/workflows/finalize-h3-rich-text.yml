name: Finalize H3 rich text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-h3-rich-text.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move dialogue formatting into shared module
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('web/h3_rich_text.js')
          text = path.read_text(encoding='utf-8')
          marker = ']);\n\nexport const H3_TOKEN_PATTERN'
          language_block = '''\n\nconst DIALOGUE_LANGUAGES = [\n  "English", "Chinese", "Cantonese", "Japanese", "Korean", "Spanish", "French",\n  "German", "Italian", "Portuguese", "Russian", "Arabic", "Hindi", "Thai",\n  "Vietnamese", "Indonesian", "Turkish", "Polish", "Dutch", "Other",\n];\n\nconst LANGUAGE_ZH = {\n  English: "英语", Chinese: "中文", Cantonese: "粤语", Japanese: "日语", Korean: "韩语",\n  Spanish: "西班牙语", French: "法语", German: "德语", Italian: "意大利语",\n  Portuguese: "葡萄牙语", Russian: "俄语", Arabic: "阿拉伯语", Hindi: "印地语",\n  Thai: "泰语", Vietnamese: "越南语", Indonesian: "印尼语", Turkish: "土耳其语",\n  Polish: "波兰语", Dutch: "荷兰语", Other: "其他",\n};\n'''
          if 'const DIALOGUE_LANGUAGES' not in text:
              text = text.replace(marker, ']);' + language_block + '\nexport const H3_TOKEN_PATTERN')

          start = text.index('function dialogueChip(')
          end = text.index('function mediaChip(', start)
          dialogue = '''function dialogueChip(raw, onChange, options = {}) {\n  const match = String(raw || "").match(/^<d>\\[([^\\]]+)\\]\\s*([\\s\\S]*?)<\\/d>$/i);\n  const chip = baseChip(raw, "dialogue", options);\n  chip.classList.add("terry-h3-dialogue", "terry-h3-dialogue-editor");\n  if (!match) { chip.textContent = raw; return chip; }\n\n  const select = document.createElement("select");\n  select.className = "terry-h3-dialogue-language";\n  select.setAttribute("aria-label", h3LocaleIsZh() ? "对白语言" : "Dialogue language");\n  const current = match[1] || "English";\n  const languages = DIALOGUE_LANGUAGES.includes(current) ? DIALOGUE_LANGUAGES : [current, ...DIALOGUE_LANGUAGES];\n  for (const language of languages) {\n    const option = document.createElement("option");\n    option.value = language;\n    option.textContent = h3LocaleIsZh() ? (LANGUAGE_ZH[language] || language) : language;\n    if (language === current) option.selected = true;\n    select.append(option);\n  }\n\n  const body = document.createElement("span");\n  body.className = "terry-h3-dialogue-text";\n  body.contentEditable = "true";\n  body.spellcheck = false;\n  body.dataset.placeholder = h3LocaleIsZh() ? "输入对白…" : "Dialogue…";\n  body.textContent = match[2] || "";\n\n  const update = () => {\n    chip.dataset.raw = `<d>[${select.value || "English"}] ${body.innerText.replaceAll("\\n", " ")}</d>`;\n    onChange?.();\n  };\n  select.addEventListener("change", update);\n  select.addEventListener("pointerdown", (event) => event.stopPropagation());\n  select.addEventListener("keydown", (event) => event.stopPropagation());\n  body.addEventListener("input", update);\n  body.addEventListener("pointerdown", (event) => event.stopPropagation());\n  body.addEventListener("keydown", (event) => { event.stopPropagation(); if (event.key === "Enter") event.preventDefault(); });\n  chip.append(select, body);\n  return chip;\n}\n\n'''
          text = text[:start] + dialogue + text[end:]

          css_old = '.terry-h3-dialogue-editor{white-space:normal!important}.terry-h3-dialogue-language-label{opacity:.72;font-size:9px}.terry-h3-dialogue-text{outline:none;min-width:30px;white-space:normal}'
          css_new = '.terry-h3-dialogue-editor{white-space:normal!important}.terry-h3-dialogue-language{height:22px;min-width:66px;max-width:92px;padding:0 4px;border:1px solid rgba(255,255,255,.12)!important;border-radius:4px;outline:none;background:#24272d!important;color:#d8dde6!important;color-scheme:dark;font:10px/1 system-ui,sans-serif;cursor:pointer}.terry-h3-dialogue-language option{color:#d8dde6!important;background:#24272d!important}.terry-h3-dialogue-text{outline:none;min-width:72px;max-width:360px;white-space:normal}'
          text = text.replace(css_old, css_new)
          path.write_text(text, encoding='utf-8')

          Path('web/h3_dialogue_locale_default.js').unlink(missing_ok=True)
          Path('web/h3_dialogue_select_theme.js').unlink(missing_ok=True)
          Path('.github/workflows/finalize-h3-rich-text.yml').unlink(missing_ok=True)

      - name: Commit
        run: |
          git config user.name "TerryTools Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify H3 dialogue formatting"
          git push origin main
