name: Refactor Enhanced File Save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-enhanced-file-save.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor backend and frontend
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')
          py = root / 'nodes/enhanced_file_save.py'
          js = root / 'web/enhanced_file_save.js'

          text = py.read_text(encoding='utf-8')

          # Replace timestamp formatter with one stable date-format input.
          text = re.sub(
              r'def _timestamp\([\s\S]*?\n\ndef _sanitize_rel_path',
              '''DATE_FORMATS = {\n    "none": "",\n    "YYYYMMDD_HHmmss": "%Y%m%d_%H%M%S",\n    "YYYY-MM-DD_HH-mm-ss": "%Y-%m-%d_%H-%M-%S",\n    "YYYY_MM_DD_HH_mm_ss": "%Y_%m_%d_%H_%M_%S",\n    "YYYYMMDDHHmmss": "%Y%m%d%H%M%S",\n    "YYYYMMDD_HHmm": "%Y%m%d_%H%M",\n    "YYYY-MM-DD_HH-mm": "%Y-%m-%d_%H-%M",\n    "YYYY_MM_DD_HH_mm": "%Y_%m_%d_%H_%M",\n    "YYYYMMDDHHmm": "%Y%m%d%H%M",\n    "YYYYMMDD_HH": "%Y%m%d_%H",\n    "YYYY-MM-DD_HH": "%Y-%m-%d_%H",\n    "YYYY_MM_DD_HH": "%Y_%m_%d_%H",\n    "YYYYMMDDHH": "%Y%m%d%H",\n    "YYYYMMDD": "%Y%m%d",\n    "YYYY-MM-DD": "%Y-%m-%d",\n    "YYYY_MM_DD": "%Y_%m_%d",\n    "YYYYMM": "%Y%m",\n}\n\ndef _timestamp(date_format: str) -> str:\n    pattern = DATE_FORMATS.get(str(date_format or "none"), "")\n    return datetime.now().strftime(pattern) if pattern else ""\n\ndef _sanitize_rel_path''',
              text,
              count=1,
          )

          text = re.sub(
              r'def _build_rel_stem\(\n    filename_template: str,\n    use_timestamp: bool,\n    ts_year: bool,\n    ts_date: bool,\n    ts_hour: bool,\n    ts_minute_second: bool,\n\) -> str:\n    stamp = _timestamp\([\s\S]*?\n    value =',
              'def _build_rel_stem(\n    filename_template: str,\n    date_format: str,\n) -> str:\n    stamp = _timestamp(date_format)\n    value =',
              text,
              count=1,
          )

          old_inputs = '''                io.Boolean.Input(\n                    "use_timestamp",\n                    display_name="启用 %date% 时间戳",\n                    default=True,\n                ),\n                io.Boolean.Input(\n                    "ts_year",\n                    display_name="时间戳：年份",\n                    default=True,\n                ),\n                io.Boolean.Input(\n                    "ts_date",\n                    display_name="时间戳：日期",\n                    default=True,\n                ),\n                io.Boolean.Input(\n                    "ts_hour",\n                    display_name="时间戳：时",\n                    default=True,\n                ),\n                io.Boolean.Input(\n                    "ts_minute_second",\n                    display_name="时间戳：分秒",\n                    default=True,\n                ),'''
          new_input = '''                io.Combo.Input(\n                    "date_format",\n                    display_name="日期格式",\n                    options=list(DATE_FORMATS.keys()),\n                    default="YYYYMMDD_HHmmss",\n                    tooltip="文件名中的 %date% 会按所选格式替换；选择 none 时会替换为空字符串。",\n                ),'''
          if old_inputs not in text:
              raise RuntimeError('timestamp input block not found')
          text = text.replace(old_inputs, new_input, 1)

          text = text.replace(
              '"可包含子文件夹，例如 project/shot_%date%。"\n                        "%date% 会按下方勾选项替换。若填写扩展名，将自动移除，"',
              '"可包含子文件夹，例如 project/shot_%date%。"\n                        "%date% 会按日期格式下拉选项替换。若填写扩展名，将自动移除，"',
          )
          text = text.replace(
              '"按真实输入类型自动保存，并提供精确文件名、%date% 时间戳和可选序列号。"',
              '"按真实输入类型自动保存，并提供精确文件名、可格式化 %date% 日期和可选序列号。"',
          )

          text = text.replace(
              '''        use_timestamp,\n        ts_year,\n        ts_date,\n        ts_hour,\n        ts_minute_second,''',
              '''        date_format,''',
              1,
          )
          text = text.replace(
              '''        stem = _build_rel_stem(\n            filename_template,\n            use_timestamp,\n            ts_year,\n            ts_date,\n            ts_hour,\n            ts_minute_second,\n        )''',
              '''        stem = _build_rel_stem(filename_template, date_format)''',
              1,
          )
          py.write_text(text, encoding='utf-8')

          # Rewrite frontend dynamic panel around semantic sections.
          js.write_text(r'''import { app } from "../../scripts/app.js";

const NODE_ID = "EnhancedFileSave";

const TYPE_WIDGETS = {
  IMAGE: ["image_compress_level"],
  AUDIO: ["audio_format", "audio_quality"],
  VIDEO: ["video_format", "video_codec", "video_encoding", "video_crf"],
  STRING: ["text_extension", "text_custom_extension"],
};
const ALL_TYPE_WIDGETS = Object.values(TYPE_WIDGETS).flat();
const FILE_WIDGETS = ["filename_template", "date_format", "append_sequence", "sequence_start", "sequence_padding"];

function localeIsZh() {
  try {
    const raw = app?.ui?.settings?.getSettingValue?.("Comfy.Locale");
    const locale = String(raw || navigator.language || "en").toLowerCase().replaceAll("_", "-");
    return locale === "zh" || locale.startsWith("zh-");
  } catch {
    return String(navigator.language || "en").toLowerCase().startsWith("zh");
  }
}

function t(zh, en) { return localeIsZh() ? zh : en; }

function getWidget(node, name) {
  return node.widgets?.find((widget) => widget?.name === name) || null;
}

function installHideAdapter(widget) {
  if (!widget || widget.__terryHideAdapter) return;
  widget.__terryHideAdapter = true;
  widget.__terryOriginalComputeSize = typeof widget.computeSize === "function"
    ? widget.computeSize.bind(widget)
    : null;
  widget.computeSize = function(width) {
    if (this.hidden) return [0, -4];
    return this.__terryOriginalComputeSize?.(width) || [width ?? 0, 20];
  };
}

function setWidgetHidden(node, name, hidden) {
  const widget = getWidget(node, name);
  if (!widget) return;
  installHideAdapter(widget);
  widget.hidden = hidden;
  widget.options ||= {};
  widget.options.hidden = hidden;
  if (widget.element?.style) widget.element.style.display = hidden ? "none" : "";
}

function moveWidgetBefore(node, widget, anchorNames) {
  const widgets = node.widgets;
  if (!Array.isArray(widgets) || !widget) return;
  const current = widgets.indexOf(widget);
  if (current >= 0) widgets.splice(current, 1);
  let anchor = -1;
  for (const name of anchorNames) {
    anchor = widgets.findIndex((item) => item?.name === name);
    if (anchor >= 0) break;
  }
  if (anchor < 0) widgets.push(widget);
  else widgets.splice(anchor, 0, widget);
}

function moveWidgetAfter(node, widget, anchorName) {
  const widgets = node.widgets;
  if (!Array.isArray(widgets) || !widget) return;
  const current = widgets.indexOf(widget);
  if (current >= 0) widgets.splice(current, 1);
  const anchor = widgets.findIndex((item) => item?.name === anchorName);
  if (anchor < 0) widgets.push(widget);
  else widgets.splice(anchor + 1, 0, widget);
}

function getGraphLink(graph, linkId) {
  if (!graph || linkId == null) return null;
  return graph.links?.[linkId]
    || graph._links?.get?.(linkId)
    || graph.links?.[String(linkId)]
    || null;
}

function nodeType(node) {
  return String(node?.type || node?.constructor?.type || node?.comfyClass || node?.constructor?.comfyClass || "").toLowerCase();
}

function normalizeType(type) {
  const value = String(type || "").toUpperCase();
  return value === "TEXT" ? "STRING" : value;
}

function resolveOriginType(graph, linkId, seen = new Set()) {
  if (linkId == null || seen.has(linkId)) return null;
  seen.add(linkId);
  const link = getGraphLink(graph, linkId);
  if (!link) return null;
  const origin = graph?.getNodeById?.(link.origin_id);
  const output = origin?.outputs?.[link.origin_slot];
  let type = normalizeType(link.type || output?.type);
  if (TYPE_WIDGETS[type]) return type;
  const originType = nodeType(origin);
  if (origin && (originType === "reroute" || originType.endsWith("reroute"))) {
    const upstream = resolveOriginType(graph, origin.inputs?.[0]?.link, seen);
    if (upstream) return upstream;
  }
  type = normalizeType(output?.type);
  return TYPE_WIDGETS[type] ? type : null;
}

function connectedType(node) {
  const input = node.inputs?.find((item) => item?.name === "data");
  if (!input || input.link == null) return null;
  return resolveOriginType(node.graph || app.graph, input.link);
}

function resizeToContent(node) {
  try {
    const measured = node.computeSize?.();
    if (measured) node.setSize?.([Math.max(node.size?.[0] || 0, measured[0] || 0), measured[1]]);
  } catch {}
  node.setDirtyCanvas?.(true, true);
  app.graph?.setDirtyCanvas?.(true, true);
}

function makeSectionWidget(node, key) {
  node.__terrySaveSections ||= {};
  if (node.__terrySaveSections[key] || typeof node.addDOMWidget !== "function") return node.__terrySaveSections[key];

  const element = document.createElement("div");
  element.style.boxSizing = "border-box";
  element.style.width = "100%";
  element.style.pointerEvents = "none";

  if (key === "divider") {
    element.style.height = "30px";
    element.style.margin = "2px 8px";
    element.style.borderTop = "1px solid color-mix(in srgb, var(--fg-color, #aaa) 24%, transparent)";
    element.style.transform = "translateY(14px)";
  } else {
    element.style.height = "28px";
    element.style.padding = "7px 10px 3px 8px";
    element.style.fontSize = "12px";
    element.style.fontWeight = "700";
    element.style.letterSpacing = ".02em";
    element.style.color = "color-mix(in srgb, var(--fg-color, #ddd) 82%, transparent)";
  }

  const widget = node.addDOMWidget(`terry_save_${key}`, "div", element, { serialize: false, hideOnZoom: false });
  widget.computeSize = function(width) {
    if (this.hidden) return [0, -4];
    return [width ?? 0, key === "divider" ? 34 : 30];
  };
  const section = { element, widget };
  node.__terrySaveSections[key] = section;
  return section;
}

function updateSectionLabels(node, type) {
  const media = makeSectionWidget(node, "media");
  const file = makeSectionWidget(node, "file");
  makeSectionWidget(node, "divider");
  const names = {
    IMAGE: t("图片参数", "Image Parameters"),
    AUDIO: t("音频参数", "Audio Parameters"),
    VIDEO: t("视频参数", "Video Parameters"),
    STRING: t("文本参数", "Text Parameters"),
  };
  media.element.textContent = names[type] || "";
  file.element.textContent = t("文件名", "Filename");

  media.widget.hidden = !type;
  media.widget.options ||= {};
  media.widget.options.hidden = !type;
  media.element.style.display = type ? "block" : "none";
}

function arrangeWidgets(node, type) {
  const media = makeSectionWidget(node, "media");
  const divider = makeSectionWidget(node, "divider");
  const file = makeSectionWidget(node, "file");

  if (type) moveWidgetBefore(node, media.widget, TYPE_WIDGETS[type]);
  moveWidgetBefore(node, divider.widget, FILE_WIDGETS);
  moveWidgetBefore(node, file.widget, FILE_WIDGETS);

  // Guarantee divider -> Filename heading -> filename fields order.
  const widgets = node.widgets;
  const fileIndex = widgets.indexOf(file.widget);
  const dividerIndex = widgets.indexOf(divider.widget);
  if (dividerIndex > fileIndex && fileIndex >= 0) {
    widgets.splice(dividerIndex, 1);
    widgets.splice(fileIndex, 0, divider.widget);
  }
}

function applyDynamicPanel(node) {
  for (const name of ALL_TYPE_WIDGETS) setWidgetHidden(node, name, true);
  const type = connectedType(node);
  if (type) for (const name of TYPE_WIDGETS[type]) setWidgetHidden(node, name, false);

  const sequence = getWidget(node, "append_sequence")?.value === true;
  setWidgetHidden(node, "sequence_start", !sequence);
  setWidgetHidden(node, "sequence_padding", !sequence);

  if (type === "AUDIO") {
    setWidgetHidden(node, "audio_quality", getWidget(node, "audio_format")?.value === "flac");
  }
  if (type === "VIDEO") {
    const codec = getWidget(node, "video_codec")?.value;
    const encoding = getWidget(node, "video_encoding")?.value;
    setWidgetHidden(node, "video_encoding", codec !== "h264");
    setWidgetHidden(node, "video_crf", !(codec === "h264" && encoding === "re-encode"));
  }
  if (type === "STRING") {
    setWidgetHidden(node, "text_custom_extension", getWidget(node, "text_extension")?.value !== "custom");
  }

  updateSectionLabels(node, type);
  arrangeWidgets(node, type);
  resizeToContent(node);
}

function hookWidget(node, name) {
  const widget = getWidget(node, name);
  if (!widget || widget.__terryDynamicPanelHooked) return;
  widget.__terryDynamicPanelHooked = true;
  const original = widget.callback;
  widget.callback = function(...args) {
    const result = original?.apply(this, args);
    queueMicrotask(() => applyDynamicPanel(node));
    return result;
  };
}

function schedulePanelRefresh(node) {
  queueMicrotask(() => applyDynamicPanel(node));
  requestAnimationFrame(() => applyDynamicPanel(node));
  setTimeout(() => applyDynamicPanel(node), 50);
  setTimeout(() => applyDynamicPanel(node), 180);
}

function initNode(node) {
  for (const widget of node.widgets || []) installHideAdapter(widget);
  for (const name of ["append_sequence", "audio_format", "video_codec", "video_encoding", "text_extension"]) hookWidget(node, name);
  makeSectionWidget(node, "media");
  makeSectionWidget(node, "divider");
  makeSectionWidget(node, "file");
  applyDynamicPanel(node);
  schedulePanelRefresh(node);
}

app.registerExtension({
  name: "TerryTools.EnhancedFileSave.DynamicPanel",
  beforeRegisterNodeDef(nodeType, nodeData) {
    if (nodeData.name !== NODE_ID) return;
    const created = nodeType.prototype.onNodeCreated;
    nodeType.prototype.onNodeCreated = function() {
      const result = created?.apply(this, arguments);
      initNode(this);
      return result;
    };
    const connections = nodeType.prototype.onConnectionsChange;
    nodeType.prototype.onConnectionsChange = function() {
      const result = connections?.apply(this, arguments);
      schedulePanelRefresh(this);
      return result;
    };
    const configure = nodeType.prototype.onConfigure;
    nodeType.prototype.onConfigure = function() {
      const result = configure?.apply(this, arguments);
      queueMicrotask(() => initNode(this));
      return result;
    };
  },
  nodeCreated(node) {
    if (node?.comfyClass === NODE_ID || node?.constructor?.type === NODE_ID) queueMicrotask(() => initNode(node));
  },
  loadedGraphNode(node) {
    if (node?.comfyClass === NODE_ID || node?.constructor?.type === NODE_ID) queueMicrotask(() => initNode(node));
  },
});
''', encoding='utf-8')

          # Update locale metadata.
          for lang in ('zh', 'en'):
              path = root / 'locales' / lang / 'nodeDefs.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              inputs = data['EnhancedFileSave']['inputs']
              for key in ('use_timestamp', 'ts_year', 'ts_date', 'ts_hour', 'ts_minute_second'):
                  inputs.pop(key, None)
              if lang == 'zh':
                  inputs['date_format'] = {"name": "日期格式", "tooltip": "文件名中的 %date% 按所选格式替换；选择 none 时不加入日期。"}
                  inputs['filename_template'] = {"name": "文件名", "tooltip": "可包含子文件夹，例如 project/shot_%date%。%date% 会按日期格式替换。"}
              else:
                  inputs['date_format'] = {"name": "Date format", "tooltip": "Replaces %date% in the filename using the selected format; choose none for no date."}
                  inputs['filename_template'] = {"name": "Filename", "tooltip": "May include subfolders, e.g. project/shot_%date%. %date% uses the selected date format."}
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove this one-time workflow before committing.
          (root / '.github/workflows/refactor-enhanced-file-save.yml').unlink()

      - name: Commit refactor
        run: |
          git config user.name "TerryTools Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refine enhanced file save parameter layout"
          git push origin main
