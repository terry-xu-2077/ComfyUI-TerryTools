name: Refactor Enhanced File Save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-enhanced-file-save.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor backend and frontend
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')
          py = root / 'nodes/enhanced_file_save.py'
          js = root / 'web/enhanced_file_save.js'
          text = py.read_text(encoding='utf-8')

          def replace_between(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          date_block = '''DATE_FORMATS = {
    "none": "",
    "YYYYMMDD_HHmmss": "%Y%m%d_%H%M%S",
    "YYYY-MM-DD_HH-mm-ss": "%Y-%m-%d_%H-%M-%S",
    "YYYY_MM_DD_HH_mm_ss": "%Y_%m_%d_%H_%M_%S",
    "YYYYMMDDHHmmss": "%Y%m%d%H%M%S",
    "YYYYMMDD_HHmm": "%Y%m%d_%H%M",
    "YYYY-MM-DD_HH-mm": "%Y-%m-%d_%H-%M",
    "YYYY_MM_DD_HH_mm": "%Y_%m_%d_%H_%M",
    "YYYYMMDDHHmm": "%Y%m%d%H%M",
    "YYYYMMDD_HH": "%Y%m%d_%H",
    "YYYY-MM-DD_HH": "%Y-%m-%d_%H",
    "YYYY_MM_DD_HH": "%Y_%m_%d_%H",
    "YYYYMMDDHH": "%Y%m%d%H",
    "YYYYMMDD": "%Y%m%d",
    "YYYY-MM-DD": "%Y-%m-%d",
    "YYYY_MM_DD": "%Y_%m_%d",
    "YYYYMM": "%Y%m",
}


def _timestamp(date_format: str) -> str:
    pattern = DATE_FORMATS.get(str(date_format or "none"), "")
    return datetime.now().strftime(pattern) if pattern else ""

'''
          text = replace_between(text, 'def _timestamp(', 'def _sanitize_rel_path', date_block + 'def _sanitize_rel_path')

          build_block = '''def _build_rel_stem(
    filename_template: str,
    date_format: str,
) -> str:
    stamp = _timestamp(date_format)
    value = (filename_template or "ComfyUI").replace("%date%", stamp)
    value = _sanitize_rel_path(value)

    # The template is a "filename stem". If the user typed an extension,
    # strip it here so the selected encoder always owns the real extension.
    p = Path(value)
    if p.suffix:
        value = str(p.with_suffix("")).replace("\\\\", "/")

    return value.rstrip("._- ") or "ComfyUI"


'''
          text = replace_between(text, 'def _build_rel_stem(', 'def _with_sequence', build_block + 'def _with_sequence')

          start = text.index('                io.Boolean.Input(\n                    "use_timestamp"')
          end = text.index('                io.Boolean.Input(\n                    "append_sequence"', start)
          combo = '''                io.Combo.Input(
                    "date_format",
                    display_name="日期格式",
                    options=list(DATE_FORMATS.keys()),
                    default="YYYYMMDD_HHmmss",
                    tooltip="文件名中的 %date% 会按所选格式替换；选择 none 时会替换为空字符串。",
                ),
'''
          text = text[:start] + combo + text[end:]

          text = text.replace('%date% 会按下方勾选项替换。', '%date% 会按日期格式下拉选项替换。')
          text = text.replace('按真实输入类型自动保存，并提供精确文件名、%date% 时间戳和可选序列号。', '按真实输入类型自动保存，并提供精确文件名、可格式化 %date% 日期和可选序列号。')

          params_start = text.index('        filename_template,\n        use_timestamp,')
          params_end = text.index('        append_sequence,', params_start)
          text = text[:params_start] + '        filename_template,\n        date_format,\n' + text[params_end:]

          call_start = text.index('        stem = _build_rel_stem(')
          call_end = text.index('\n\n        if kind == "text":', call_start)
          text = text[:call_start] + '        stem = _build_rel_stem(filename_template, date_format)' + text[call_end:]
          py.write_text(text, encoding='utf-8')

          js.write_text(r'''import { app } from "../../scripts/app.js";

const NODE_ID = "EnhancedFileSave";
const TYPE_WIDGETS = {
  IMAGE: ["image_compress_level"],
  AUDIO: ["audio_format", "audio_quality"],
  VIDEO: ["video_format", "video_codec", "video_encoding", "video_crf"],
  STRING: ["text_extension", "text_custom_extension"],
};
const ALL_TYPE_WIDGETS = Object.values(TYPE_WIDGETS).flat();
const FILE_WIDGETS = ["filename_template", "date_format", "append_sequence", "sequence_start", "sequence_padding"];

function localeIsZh() {
  try {
    const raw = app?.ui?.settings?.getSettingValue?.("Comfy.Locale");
    const locale = String(raw || navigator.language || "en").toLowerCase().replaceAll("_", "-");
    return locale === "zh" || locale.startsWith("zh-");
  } catch { return String(navigator.language || "en").toLowerCase().startsWith("zh"); }
}
function t(zh, en) { return localeIsZh() ? zh : en; }
function getWidget(node, name) { return node.widgets?.find((w) => w?.name === name) || null; }

function installHideAdapter(widget) {
  if (!widget || widget.__terryHideAdapter) return;
  widget.__terryHideAdapter = true;
  widget.__terryOriginalComputeSize = typeof widget.computeSize === "function" ? widget.computeSize.bind(widget) : null;
  widget.computeSize = function(width) {
    if (this.hidden) return [0, -4];
    return this.__terryOriginalComputeSize?.(width) || [width ?? 0, 20];
  };
}
function setWidgetHidden(node, name, hidden) {
  const w = getWidget(node, name);
  if (!w) return;
  installHideAdapter(w);
  w.hidden = hidden;
  w.options ||= {};
  w.options.hidden = hidden;
  if (w.element?.style) w.element.style.display = hidden ? "none" : "";
}
function moveWidgetBefore(node, widget, anchors) {
  const widgets = node.widgets;
  if (!Array.isArray(widgets) || !widget) return;
  const current = widgets.indexOf(widget);
  if (current >= 0) widgets.splice(current, 1);
  let anchor = -1;
  for (const name of anchors) {
    anchor = widgets.findIndex((w) => w?.name === name);
    if (anchor >= 0) break;
  }
  if (anchor < 0) widgets.push(widget); else widgets.splice(anchor, 0, widget);
}
function getGraphLink(graph, id) {
  if (!graph || id == null) return null;
  return graph.links?.[id] || graph._links?.get?.(id) || graph.links?.[String(id)] || null;
}
function normalizeType(type) {
  const value = String(type || "").toUpperCase();
  return value === "TEXT" ? "STRING" : value;
}
function nodeType(node) {
  return String(node?.type || node?.constructor?.type || node?.comfyClass || node?.constructor?.comfyClass || "").toLowerCase();
}
function resolveOriginType(graph, linkId, seen = new Set()) {
  if (linkId == null || seen.has(linkId)) return null;
  seen.add(linkId);
  const link = getGraphLink(graph, linkId);
  if (!link) return null;
  const origin = graph?.getNodeById?.(link.origin_id);
  const output = origin?.outputs?.[link.origin_slot];
  let type = normalizeType(link.type || output?.type);
  if (TYPE_WIDGETS[type]) return type;
  const originType = nodeType(origin);
  if (origin && (originType === "reroute" || originType.endsWith("reroute"))) {
    const upstream = resolveOriginType(graph, origin.inputs?.[0]?.link, seen);
    if (upstream) return upstream;
  }
  type = normalizeType(output?.type);
  return TYPE_WIDGETS[type] ? type : null;
}
function connectedType(node) {
  const input = node.inputs?.find((i) => i?.name === "data");
  return input?.link == null ? null : resolveOriginType(node.graph || app.graph, input.link);
}
function resizeToContent(node) {
  try {
    const measured = node.computeSize?.();
    if (measured) node.setSize?.([Math.max(node.size?.[0] || 0, measured[0] || 0), measured[1]]);
  } catch {}
  node.setDirtyCanvas?.(true, true);
  app.graph?.setDirtyCanvas?.(true, true);
}
function makeSection(node, key) {
  node.__terrySaveSections ||= {};
  if (node.__terrySaveSections[key] || typeof node.addDOMWidget !== "function") return node.__terrySaveSections[key];
  const element = document.createElement("div");
  element.style.boxSizing = "border-box";
  element.style.width = "100%";
  element.style.pointerEvents = "none";
  if (key === "divider") {
    element.style.height = "32px";
    element.style.margin = "0 10px";
    element.style.borderTop = "1px solid color-mix(in srgb, var(--fg-color, #aaa) 24%, transparent)";
    element.style.transform = "translateY(16px)";
  } else {
    element.style.height = "30px";
    element.style.padding = "8px 10px 3px";
    element.style.fontSize = "12px";
    element.style.fontWeight = "700";
    element.style.letterSpacing = ".02em";
    element.style.color = "color-mix(in srgb, var(--fg-color, #ddd) 82%, transparent)";
  }
  const widget = node.addDOMWidget(`terry_save_${key}`, "div", element, { serialize: false, hideOnZoom: false });
  widget.computeSize = function(width) { return this.hidden ? [0, -4] : [width ?? 0, key === "divider" ? 36 : 32]; };
  return node.__terrySaveSections[key] = { element, widget };
}
function updateSections(node, type) {
  const media = makeSection(node, "media");
  const divider = makeSection(node, "divider");
  const file = makeSection(node, "file");
  const labels = { IMAGE: t("图片参数", "Image Parameters"), AUDIO: t("音频参数", "Audio Parameters"), VIDEO: t("视频参数", "Video Parameters"), STRING: t("文本参数", "Text Parameters") };
  media.element.textContent = labels[type] || "";
  file.element.textContent = t("文件名", "Filename");
  media.widget.hidden = !type;
  media.widget.options ||= {};
  media.widget.options.hidden = !type;
  media.element.style.display = type ? "block" : "none";
  if (type) moveWidgetBefore(node, media.widget, TYPE_WIDGETS[type]);
  moveWidgetBefore(node, divider.widget, FILE_WIDGETS);
  moveWidgetBefore(node, file.widget, FILE_WIDGETS);
  const widgets = node.widgets || [];
  const d = widgets.indexOf(divider.widget), f = widgets.indexOf(file.widget);
  if (d > f && f >= 0) { widgets.splice(d, 1); widgets.splice(f, 0, divider.widget); }
}
function applyDynamicPanel(node) {
  for (const name of ALL_TYPE_WIDGETS) setWidgetHidden(node, name, true);
  const type = connectedType(node);
  if (type) for (const name of TYPE_WIDGETS[type]) setWidgetHidden(node, name, false);
  const sequence = getWidget(node, "append_sequence")?.value === true;
  setWidgetHidden(node, "sequence_start", !sequence);
  setWidgetHidden(node, "sequence_padding", !sequence);
  if (type === "AUDIO") setWidgetHidden(node, "audio_quality", getWidget(node, "audio_format")?.value === "flac");
  if (type === "VIDEO") {
    const codec = getWidget(node, "video_codec")?.value;
    const encoding = getWidget(node, "video_encoding")?.value;
    setWidgetHidden(node, "video_encoding", codec !== "h264");
    setWidgetHidden(node, "video_crf", !(codec === "h264" && encoding === "re-encode"));
  }
  if (type === "STRING") setWidgetHidden(node, "text_custom_extension", getWidget(node, "text_extension")?.value !== "custom");
  updateSections(node, type);
  resizeToContent(node);
}
function hookWidget(node, name) {
  const w = getWidget(node, name);
  if (!w || w.__terryDynamicPanelHooked) return;
  w.__terryDynamicPanelHooked = true;
  const old = w.callback;
  w.callback = function(...args) { const result = old?.apply(this, args); queueMicrotask(() => applyDynamicPanel(node)); return result; };
}
function schedule(node) {
  queueMicrotask(() => applyDynamicPanel(node));
  requestAnimationFrame(() => applyDynamicPanel(node));
  setTimeout(() => applyDynamicPanel(node), 50);
  setTimeout(() => applyDynamicPanel(node), 180);
}
function initNode(node) {
  for (const w of node.widgets || []) installHideAdapter(w);
  for (const name of ["append_sequence", "audio_format", "video_codec", "video_encoding", "text_extension"]) hookWidget(node, name);
  makeSection(node, "media"); makeSection(node, "divider"); makeSection(node, "file");
  applyDynamicPanel(node); schedule(node);
}

app.registerExtension({
  name: "TerryTools.EnhancedFileSave.DynamicPanel",
  beforeRegisterNodeDef(nodeType, nodeData) {
    if (nodeData.name !== NODE_ID) return;
    const created = nodeType.prototype.onNodeCreated;
    nodeType.prototype.onNodeCreated = function() { const r = created?.apply(this, arguments); initNode(this); return r; };
    const connections = nodeType.prototype.onConnectionsChange;
    nodeType.prototype.onConnectionsChange = function() { const r = connections?.apply(this, arguments); schedule(this); return r; };
    const configure = nodeType.prototype.onConfigure;
    nodeType.prototype.onConfigure = function() { const r = configure?.apply(this, arguments); queueMicrotask(() => initNode(this)); return r; };
  },
  nodeCreated(node) { if (node?.comfyClass === NODE_ID || node?.constructor?.type === NODE_ID) queueMicrotask(() => initNode(node)); },
  loadedGraphNode(node) { if (node?.comfyClass === NODE_ID || node?.constructor?.type === NODE_ID) queueMicrotask(() => initNode(node)); },
});
''', encoding='utf-8')

          for lang in ('zh', 'en'):
              path = root / 'locales' / lang / 'nodeDefs.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              inputs = data['EnhancedFileSave']['inputs']
              for key in ('use_timestamp', 'ts_year', 'ts_date', 'ts_hour', 'ts_minute_second'):
                  inputs.pop(key, None)
              if lang == 'zh':
                  inputs['date_format'] = {"name": "日期格式", "tooltip": "文件名中的 %date% 按所选格式替换；选择 none 时不加入日期。"}
                  inputs['filename_template'] = {"name": "文件名", "tooltip": "可包含子文件夹，例如 project/shot_%date%。%date% 会按日期格式替换。"}
              else:
                  inputs['date_format'] = {"name": "Date format", "tooltip": "Replaces %date% using the selected format; choose none for no date."}
                  inputs['filename_template'] = {"name": "Filename", "tooltip": "May include subfolders, e.g. project/shot_%date%. %date% uses the selected date format."}
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (root / '.github/workflows/refactor-enhanced-file-save.yml').unlink()

      - name: Commit refactor
        run: |
          git config user.name "TerryTools Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refine enhanced file save parameter layout"
          git push origin main
